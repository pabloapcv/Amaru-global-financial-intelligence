name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # Tests use synthetic data and a temporary database; no network or API keys needed.
        env:
          ATLAS_LLM: "off"
        run: python -m pytest -q

  backend-postgres:
    # Same suite against TimescaleDB, the production database.
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Test on PostgreSQL
        env:
          ATLAS_LLM: "off"
          ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t atlas-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t atlas-web:ci .
      - name: Smoke-test API image
        run: |
          docker run -d --name api -p 8010:8010 -e ATLAS_DATABASE_URL=sqlite:////data/atlas.db atlas-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8010/health && exit 0; sleep 1; done
          docker logs api; exit 1
