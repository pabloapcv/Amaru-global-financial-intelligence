# Production-like stack: TimescaleDB, API, ingestion/report scheduler, web.
#   cp .env.example .env   # set ANTHROPIC_API_KEY, POSTGRES_PASSWORD
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d --build
#   docker compose -f infrastructure/docker/docker-compose.yml exec api atlas ingest   # first backfill
#   docker compose -f infrastructure/docker/docker-compose.yml exec api atlas create-user you@example.com --workspace local --plan pro
x-atlas-env: &atlas-env
  ATLAS_DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
  ATLAS_OBJECT_STORE: /data/objects
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ATLAS_AUTH: ${ATLAS_AUTH:-required}
  ATLAS_ALLOW_SIGNUP: ${ATLAS_ALLOW_SIGNUP:-true}
  ATLAS_COOKIE_SECURE: ${ATLAS_COOKIE_SECURE:-false}
  ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-http://localhost:3010}
  ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-http://localhost:3010}
  ATLAS_API_PUBLIC_URL: ${ATLAS_API_PUBLIC_URL:-http://localhost:8010}
  ATLAS_REQUIRE_EMAIL_VERIFICATION: ${ATLAS_REQUIRE_EMAIL_VERIFICATION:-false}
  ATLAS_OPERATOR_EMAILS: ${ATLAS_OPERATOR_EMAILS:-}
  ATLAS_PLAN_PRICES: ${ATLAS_PLAN_PRICES:-}
  ATLAS_PLAN_CURRENCY: ${ATLAS_PLAN_CURRENCY:-USD}
  ATLAS_SALES_EMAIL: ${ATLAS_SALES_EMAIL:-}
  ATLAS_TERMS_URL: ${ATLAS_TERMS_URL:-}
  ATLAS_PRIVACY_URL: ${ATLAS_PRIVACY_URL:-}
  ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-claude-opus-5-5}
  FRED_API_KEY: ${FRED_API_KEY:-}
  EIA_API_KEY: ${EIA_API_KEY:-}
  ATLAS_SMTP_HOST: ${ATLAS_SMTP_HOST:-}
  ATLAS_SMTP_PORT: ${ATLAS_SMTP_PORT:-587}
  ATLAS_SMTP_USER: ${ATLAS_SMTP_USER:-}
  ATLAS_SMTP_PASSWORD: ${ATLAS_SMTP_PASSWORD:-}
  ATLAS_SMTP_FROM: ${ATLAS_SMTP_FROM:-}
  ATLAS_SMTP_STARTTLS: ${ATLAS_SMTP_STARTTLS:-true}
  ATLAS_METRICS_TOKEN: ${ATLAS_METRICS_TOKEN:-}
  ATLAS_USER_AGENT: ${ATLAS_USER_AGENT:-}
  # Encrypts two-factor secrets at rest. Set it in production; without it a key is generated once on the data volume.
  ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:-}
  ATLAS_SECRET_KEY_FILE: /data/secret.key
  ATLAS_COMMERCIAL_MODE: ${ATLAS_COMMERCIAL_MODE:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_INVESTOR: ${STRIPE_PRICE_INVESTOR:-}
  STRIPE_PRICE_RESEARCH_PRO: ${STRIPE_PRICE_RESEARCH_PRO:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    volumes: [atlas-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      retries: 20

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    environment: *atlas-env
    volumes: [atlas-objects:/data]
    ports: ["8010:8010"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"]
      interval: 15s

  scheduler:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ["atlas", "schedule"]
    environment: *atlas-env
    volumes: [atlas-objects:/data]
    depends_on: { api: { condition: service_healthy } }

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8010}" }
    ports: ["3010:3010"]
    depends_on: [api]

volumes:
  atlas-db:
  atlas-objects:
