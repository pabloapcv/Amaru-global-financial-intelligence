[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Amaru — Global Financial Intelligence Platform (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "anthropic>=1.0",
    "markdown>=3.6",
    "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
pdf = ["weasyprint>=62"]  # also needs Pango system libraries (see api.Dockerfile)
dev = ["pytest>=8"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["reporting/templates/*.html", "instruments/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
